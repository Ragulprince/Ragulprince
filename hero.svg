<svg width="850" height="320" viewBox="0 0 850 320" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'JetBrains Mono', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#12060C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F85D7F"/>
      <stop offset="100%" stop-color="#8B1E3F"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="1" y="1" width="848" height="318" rx="16" fill="url(#bg)" stroke="#1F2A37" stroke-width="1.5"/>
  <rect x="1" y="1" width="848" height="318" rx="16" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.35"/>

  <!-- animated scan line -->
  <line x1="0" y1="0" x2="850" y2="0" stroke="#F85D7F" stroke-width="1" opacity="0.12">
    <animate attributeName="y1" values="30;300;30" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="30;300;30" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- window chrome -->
  <circle cx="34" cy="34" r="6" fill="#F85D7F"/>
  <circle cx="56" cy="34" r="6" fill="#3A2530"/>
  <circle cx="78" cy="34" r="6" fill="#3A2530"/>
  <text x="110" y="39" fill="#4B5563" font-size="13">ragul@systems ~ %</text>

  <!-- greeting + name -->
  <text x="44" y="108" fill="#F85D7F" font-size="22" font-weight="500" letter-spacing="1">Hi, I'm</text>
  <text x="42" y="172" fill="#FFFFFF" font-size="66" font-weight="700" letter-spacing="3" filter="url(#glow)">RAGUL</text>
  <text x="46" y="204" fill="#C9D1D9" font-size="19" font-weight="500" letter-spacing="1">Backend &amp; Cloud Engineer</text>

  <!-- meta row -->
  <text x="46" y="238" fill="#8B98A5" font-size="14">
    <tspan fill="#F85D7F">◆</tspan> Chennai, India
    <tspan dx="18" fill="#F85D7F">◆</tspan> 3+ yrs building production systems
  </text>

  <!-- typed prompt line -->
  <text x="46" y="272" fill="#6B7B8C" font-size="14.5">
    <tspan fill="#F85D7F">$</tspan> whoami --focus
  </text>
  <text x="46" y="297" fill="#C9D1D9" font-size="14.5">
    <tspan>idea</tspan>
    <tspan fill="#F85D7F"> → </tspan>
    <tspan>architecture</tspan>
    <tspan fill="#F85D7F"> → </tspan>
    <tspan>deploy</tspan>
    <tspan fill="#F85D7F"> → </tspan>
    <tspan>scale</tspan>
    <tspan fill="#F85D7F" font-weight="700">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- right-side tech orbit dots -->
  <g opacity="0.9">
    <text x="640" y="120" fill="#00ADD8" font-size="13" font-weight="600">Go</text>
    <text x="720" y="150" fill="#3776AB" font-size="13" font-weight="600">Python</text>
    <text x="655" y="185" fill="#326CE5" font-size="13" font-weight="600">Kubernetes</text>
    <text x="740" y="218" fill="#FF9900" font-size="13" font-weight="600">AWS</text>
    <text x="648" y="250" fill="#009688" font-size="13" font-weight="600">FastAPI</text>
    <text x="738" y="282" fill="#F85D7F" font-size="13" font-weight="600">RAG</text>
    <circle cx="620" cy="115" r="3" fill="#00ADD8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="145" r="3" fill="#3776AB"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="635" cy="180" r="3" fill="#326CE5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="213" r="3" fill="#FF9900"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="628" cy="245" r="3" fill="#009688"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="718" cy="277" r="3" fill="#F85D7F"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
