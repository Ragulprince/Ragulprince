<svg width="850" height="130" viewBox="0 0 850 130" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'JetBrains Mono', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#1A0A12"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="facc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B1E3F"/>
      <stop offset="50%" stop-color="#F85D7F"/>
      <stop offset="100%" stop-color="#8B1E3F"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="848" height="128" rx="14" fill="url(#fbg)" stroke="#1F2A37" stroke-width="1.5"/>

  <!-- top accent bar animated -->
  <rect x="1" y="1" width="848" height="3" rx="1.5" fill="url(#facc)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- status dot -->
  <circle cx="60" cy="55" r="6" fill="#3FB950">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="60" fill="#C9D1D9" font-size="17" font-weight="500">Lets Build Something Great </text>

  <text x="60" y="95" fill="#6B7B8C" font-size="14">
    <tspan fill="#F85D7F">$</tspan> reach me
    <tspan dx="12" fill="#8B98A5">linkedin/in/ragul3</tspan>
    <tspan dx="10" fill="#3A2530">·</tspan>
    <tspan dx="10" fill="#8B98A5">x.com/iamRagul8</tspan>
    <tspan dx="10" fill="#3A2530">·</tspan>
    <tspan dx="10" fill="#8B98A5">github.com/Ragulprince</tspan>
  </text>

  <!-- right accent: build cursor -->
  <text x="700" y="72" fill="#F85D7F" font-size="30" font-weight="700" letter-spacing="2" text-anchor="middle">&lt;/&gt;
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </text>
</svg>
